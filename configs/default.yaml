# Default training configuration

data:
  root_dir: "data/celeba"
  image_size: 224
  batch_size: 64
  num_workers: 2
  pin_memory: false
  # CelebA official splits: 0=train, 1=val, 2=test
  # Managed via list_eval_partition.txt, not random splitting
  use_official_split: true

model:
  name: "custom_cnn"         # "custom_cnn" | "mobilenet_v2" | "xception"
  pretrained: true
  num_classes: 1             # binary classification via sigmoid
  dropout: 0.3

training:
  epochs: 30
  learning_rate: 0.001
  weight_decay: 0.0001
  optimizer: "adam"           # "adam" | "sgd"
  scheduler: "cosine"        # "cosine" | "step" | "none"
  early_stopping_patience: 5

wandb:
  project: "dla-gender-recognition"
  entity: null               # set your wandb team/username
  log_interval: 10
  enabled: true

seed: 42
device: "auto"               # "auto" | "cuda" | "mps" | "cpu"
