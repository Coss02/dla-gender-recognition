# Training configuration for finetuned Xception

data:
  root_dir: "data/celeba"
  image_size: 299                  # Xception native input size
  batch_size: 32                   # larger model, reduce batch size
  num_workers: 2
  pin_memory: false
  use_official_split: true

model:
  name: "xception"
  pretrained: true
  num_classes: 1
  dropout: 0.3

training:
  epochs: 20
  learning_rate: 0.0001
  weight_decay: 0.0001
  optimizer: "adam"
  scheduler: "cosine"
  early_stopping_patience: 5

seed: 42
device: "auto"
